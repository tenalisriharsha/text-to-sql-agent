[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "An agentic natural-language-to-SQL assistant with schema retrieval, SQL validation, scan-cost guardrails, and audit trails."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "tenalisriharsha" }]
dependencies = [
    "duckdb>=1.0.0",
    "sqlglot>=25.0.0",
    "pyarrow>=16.0.0",
    "click>=8.1.0",
    "faker>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
athena = [
    "pyathena>=3.0.0",
]
bigquery = [
    "google-cloud-bigquery>=3.0.0",
]

[project.scripts]
text-to-sql-agent = "text_to_sql_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
